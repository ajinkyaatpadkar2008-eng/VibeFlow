<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#08070c"
    >

    <title>Login — VibeFlow</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="auth.css">

</head>


<body>

<div class="auth-page">

    <div class="auth-card">

        <a
            href="index.html"
            class="auth-logo"
        >

            <span class="auth-logo-icon">
                <i class="fa-solid fa-wave-square"></i>
            </span>

            <strong>
                Vibe<span>Flow</span>
            </strong>

        </a>


        <div class="auth-heading">

            <h1>
                Welcome back
            </h1>

            <p>
                Login to continue listening.
            </p>

        </div>


        <form
            id="loginForm"
            class="auth-form"
        >

            <label for="loginEmail">
                Email
            </label>

            <input
                id="loginEmail"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >


            <label for="loginPassword">
                Password
            </label>

            <div class="password-field">

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-target="loginPassword"
                >
                    <i class="fa-solid fa-eye"></i>
                </button>

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                Login
            </button>


            <div
                id="loginMessage"
                class="auth-message"
            ></div>

        </form>


        <p class="auth-switch">

            Don't have an account?

            <a href="signup.html">
                Sign up
            </a>

        </p>


        <a
            href="index.html"
            class="back-home"
        >
            <i class="fa-solid fa-arrow-left"></i>
            Back to VibeFlow
        </a>

    </div>

</div>


<script src="auth.js"></script>

</body>

</html>
