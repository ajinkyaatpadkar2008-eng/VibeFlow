<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — VibeFlow</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Authentication CSS -->
    <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-page">

    <!-- LEFT SIDE -->
    <div class="auth-showcase">

        <div class="showcase-content">

            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-wave-square"></i>
                </div>

                <span>
                    Vibe<span>Flow</span>
                </span>
            </div>

            <div class="showcase-text">

                <span class="eyebrow">
                    WELCOME BACK
                </span>

                <h1>
                    Your music.
                    <span>Your vibe.</span>
                </h1>

                <p>
                    Sign in and continue discovering
                    music that matches your mood.
                </p>

            </div>

            <div class="music-decoration">

                <div class="music-circle circle-one">
                    <i class="fa-solid fa-music"></i>
                </div>

                <div class="music-circle circle-two">
                    <i class="fa-solid fa-headphones"></i>
                </div>

                <div class="music-circle circle-three">
                    <i class="fa-solid fa-heart"></i>
                </div>

            </div>

        </div>

    </div>


    <!-- RIGHT SIDE -->
    <div class="auth-container">

        <div class="auth-card">

            <div class="mobile-brand">

                <div class="brand-icon">
                    <i class="fa-solid fa-wave-square"></i>
                </div>

                <span>
                    Vibe<span>Flow</span>
                </span>

            </div>


            <div class="auth-heading">

                <h2>Welcome back</h2>

                <p>
                    Sign in to continue to VibeFlow
                </p>

            </div>


            <!-- ERROR / SUCCESS MESSAGE -->

            <div
                id="authMessage"
                class="auth-message"
                role="alert"
            ></div>


            <!-- LOGIN FORM -->

            <form id="loginForm" novalidate>

                <div class="form-group">

                    <label for="loginEmail">
                        Email address
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            id="loginEmail"
                            type="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            id="loginPassword"
                            type="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="loginPassword"
                            aria-label="Show password"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <div class="form-options">

                    <label class="remember">

                        <input
                            id="rememberMe"
                            type="checkbox"
                        >

                        <span>Remember me</span>

                    </label>

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                    id="loginButton"
                >
                    <span>Sign In</span>

                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <p class="switch-auth">

                Don't have an account?

                <a href="signup.html">
                    Create one
                </a>

            </p>


            <a
                href="index.html"
                class="guest-link"
            >
                <i class="fa-solid fa-headphones"></i>

                Continue without an account

            </a>

        </div>

    </div>

</div>


<script src="auth.js"></script>

</body>
</html>
