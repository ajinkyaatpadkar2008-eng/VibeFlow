<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#08070c"
    >

    <title>Create Account — VibeFlow</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="auth.css">

</head>


<body>

<div class="auth-page">

    <div class="auth-card">

        <a
            href="index.html"
            class="auth-logo"
        >

            <span class="auth-logo-icon">
                <i class="fa-solid fa-wave-square"></i>
            </span>

            <strong>
                Vibe<span>Flow</span>
            </strong>

        </a>


        <div class="auth-heading">

            <h1>
                Create your account
            </h1>

            <p>
                Join VibeFlow and save your music.
            </p>

        </div>


        <form
            id="signupForm"
            class="auth-form"
        >

            <label for="signupName">
                Name
            </label>

            <input
                id="signupName"
                type="text"
                placeholder="Your name"
                autocomplete="name"
                minlength="2"
                required
            >


            <label for="signupEmail">
                Email
            </label>

            <input
                id="signupEmail"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >


            <label for="signupPassword">
                Password
            </label>

            <div class="password-field">

                <input
                    id="signupPassword"
                    type="password"
                    placeholder="At least 6 characters"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-target="signupPassword"
                >
                    <i class="fa-solid fa-eye"></i>
                </button>

            </div>


            <label for="signupConfirm">
                Confirm password
            </label>

            <div class="password-field">

                <input
                    id="signupConfirm"
                    type="password"
                    placeholder="Repeat your password"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-target="signupConfirm"
                >
                    <i class="fa-solid fa-eye"></i>
                </button>

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                Create account
            </button>


            <div
                id="signupMessage"
                class="auth-message"
            ></div>

        </form>


        <p class="auth-switch">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a
            href="index.html"
            class="back-home"
        >
            <i class="fa-solid fa-arrow-left"></i>
            Back to VibeFlow
        </a>

    </div>

</div>


<script src="auth.js"></script>

</body>

</html>
