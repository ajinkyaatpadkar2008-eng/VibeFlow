<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account — VibeFlow</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>

<body>

<div class="auth-page">

    <!-- BACKGROUND -->

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>


    <main class="auth-container">

        <!-- LOGO -->

        <div class="auth-logo">

            <div class="logo-icon">
                <i class="fa-solid fa-wave-square"></i>
            </div>

            <span>
                Vibe<span>Flow</span>
            </span>

        </div>


        <!-- CARD -->

        <section class="auth-card">

            <div class="auth-heading">

                <h1>Create your account</h1>

                <p>
                    Join VibeFlow and build your music world.
                </p>

            </div>


            <!-- MESSAGE -->

            <div
                id="authMessage"
                class="auth-message"
            ></div>


            <!-- SIGNUP FORM -->

            <form
                id="signupForm"
                autocomplete="on"
            >

                <!-- USERNAME -->

                <div class="input-group">

                    <label for="signupUsername">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-user"></i>

                        <input
                            id="signupUsername"
                            type="text"
                            placeholder="Choose a username"
                            autocomplete="username"
                            minlength="3"
                            maxlength="20"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            id="signupPassword"
                            type="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="signupPassword"
                        >

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-shield-halved"></i>

                        <input
                            id="confirmPassword"
                            type="password"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                        >

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- TERMS -->

                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to use VibeFlow responsibly.
                    </span>

                </label>


                <!-- SIGNUP -->

                <button
                    type="submit"
                    class="auth-submit"
                >

                    <span>Create account</span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>


            <!-- LOGIN -->

            <div class="auth-switch">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Sign in
                </a>

            </div>

        </section>


        <p class="auth-footer">
            © 2026 VibeFlow · Music for your mood.
        </p>

    </main>

</div>


<script src="auth.js"></script>

</body>

</html>
